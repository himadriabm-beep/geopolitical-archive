<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geopolitical Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<button id="menuToggle" class="menu-toggle" aria-label="Open sections menu" aria-expanded="false">
  <span></span><span></span><span></span>
</button>

<div id="scrim" class="scrim" hidden></div>

<aside id="sidebar" class="sidebar">
  <div class="brand">
    <h1>Geopolitical Archive</h1>
    <p id="brandMeta" class="brand-meta"></p>
  </div>
  <nav id="sectionNav" class="section-nav" aria-label="Sections"></nav>
  <div class="sidebar-foot">
    <p>Every figure carries its source. Unsourced claims are marked as analysis or as gaps.</p>
  </div>
</aside>

<main class="main">
  <header class="page-head">
    <h2 id="sectionTitle"></h2>
    <p id="sectionSummary" class="section-summary"></p>
    <div id="tabBar" class="tab-bar" role="tablist"></div>
  </header>
  <div id="content" class="content"></div>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
